kind = "web"
previewPath = "/"
title = "Darzi Khata"
description = "A mobile-first Pakistani tailor management web app called Darzi Khata (درزی کھاتہ). Helps tailors record customer measurements, track order statuses, manage billing/advance payments, and generate WhatsApp receipts — all offline using localStorage. Bilingual UI in English and Roman/Nastaliq Urdu."
version = "1.0.0"
id = "artifacts/darzi-khata"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24310

[services.development]
run = "pnpm --filter @workspace/darzi-khata run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/darzi-khata", "run", "build" ]
serve = "static"
publicDir = "artifacts/darzi-khata/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24310"
BASE_PATH = "/"
