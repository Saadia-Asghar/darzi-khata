<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Installed app skips the landing page; language and direction are set before first paint.
      (function () {
        try {
          var base = '%BASE_URL%'.replace(/\/$/, '');
          var path = location.pathname.replace(/\/$/, '');
          var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
          if (standalone && path === base) location.replace(base + '/app');
          if (localStorage.getItem('darzi-khata-auth-lang') === 'ur' && path === base) {
            document.documentElement.lang = 'ur';
            document.documentElement.dir = 'rtl';
          }
          if (path === base && !standalone) {
            var hero = document.createElement('link');
            hero.rel = 'preload'; hero.as = 'image'; hero.fetchPriority = 'high';
            hero.href = base + '/screens/orders-' + (document.documentElement.lang === 'ur' ? 'ur' : 'en') + '.webp';
            document.head.appendChild(hero);
          }
        } catch (e) {}
      })();
    </script>
    <title>Darzi Khata. Tailor shop khata, payments and credit on one phone</title>
    <meta name="description" content="An offline khata for Pakistani tailors. Record orders and measurements, send the parchi on WhatsApp with a payment QR, and build a credit profile from your own register. Free to start." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://darzi-khata.replit.app/" />

    <meta name="theme-color" content="#155B43" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Darzi Khata" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <meta property="og:site_name" content="Darzi Khata" />
    <meta property="og:title" content="Darzi Khata. Tailor shop khata, payments and credit on one phone" />
    <meta property="og:description" content="Works without internet. Orders, measurements, WhatsApp parchi with a Zindigi or Raast QR, and a credit profile built from the shop's own khata." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://darzi-khata.replit.app/" />
    <meta property="og:image" content="https://darzi-khata.replit.app/screens/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Darzi Khata order list on a phone" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:locale:alternate" content="ur_PK" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Darzi Khata. Tailor shop khata, payments and credit on one phone" />
    <meta name="twitter:description" content="Works without internet. Free to start." />
    <meta name="twitter:image" content="https://darzi-khata.replit.app/screens/og.png" />

    <style>
      html, body { background-color: hsl(150 10% 98%); color: hsl(160 20% 12%); margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Darzi Khata needs JavaScript to run. Your data stays on your phone.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
